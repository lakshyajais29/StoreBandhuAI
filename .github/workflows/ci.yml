name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok}" && break; sleep 2; done
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Integration tests (must not skip in CI)
        run: |
          npm run test:integration | tee integration.log
          if grep -q "# skipped [1-9]" integration.log; then echo "integration tests skipped - Mongo not reachable"; exit 1; fi
      - name: Widget build
        working-directory: widget
        run: npm ci && npm run typecheck && npm run build

  evals:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run evals -- --threshold=0.9 --out=evals/report.json
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/report.json }
