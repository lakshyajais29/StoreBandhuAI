<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>storebandhu dashboard — Bandhu AI demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #EEF0F5; color: #1E2248; }
    header { background: #fff; border-bottom: 1px solid #D9DCE7; padding: 14px 24px; font-weight: 700; }
    main { padding: 24px; max-width: 760px; }
    code { background: #fff; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>storebandhu · Demo Fashion Store</header>
  <main>
    <h1>Dashboard (mock)</h1>
    <p>This page stands in for the Laravel merchant dashboard. The assistant is in the bottom-right corner.</p>
    <p>Try: <code>aaj kitna becha</code>, <code>stock of blue shirt</code>, <code>create listing</code>, or attach a photo and say <code>white background image</code>.</p>
  </main>
  <script src="./dist/bandhu-widget.js"></script>
  <script>
    // In production Laravel renders this with the logged-in merchant; the mock endpoint mints a dev token.
    BandhuAI.mount({
      apiBaseUrl: 'http://localhost:4000',
      startOpen: true,
      getToken: async () => {
        const r = await fetch('/api/v1/agent/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ merchant_id: 'm_demo', user_id: 'u_demo' }) });
        return (await r.json()).token;
      },
    });
  </script>
</body>
</html>
